mqtt_broker: "YOUR_MQTT_BROKER_HOST"
mqtt_port: 1884
mqtt_username: "YOUR_MQTT_USERNAME"
mqtt_password: "YOUR_MQTT_PASSWORD"
mqtt_topic: "VisWELD_FACCIN"

yolo_model: "best.pt"
conf: 0.5  # Confidence threshold for the YOLO model

camera_url: "rtsp://USER:PASSWORD@CAMERA_IP:554/Streaming/Channels/102"  # Leave empty for default camera, or provide RTSP URL

log_file: "condition_log.xlsx"
detection_interval: 3  # Time in seconds between each frame detection
data_sending_interval: 30  # Time in seconds between each data send via MQTT

assetCode: HXX-XXX
assetName: Faccin
assetType: Smart Rolling Station
